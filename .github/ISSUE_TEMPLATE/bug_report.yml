name: Bug Report
description: Report a defect, regression, or unexpected behavior in vid2llm.
title: "[Bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much
        detail as you can. Reports with reproduction steps are prioritized.

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
      placeholder: vid2llm crashes when extracting frames from MKV files larger than 2GB.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: A minimal, complete sequence of steps that reproduces the bug.
      placeholder: |
        1. Run `vid2llm extract sample.mkv --backend opencv`
        2. Observe the crash after 30 seconds
      render: markdown
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What you expected to happen instead.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened, including any error messages or tracebacks.
      render: shell
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: vid2llm version
      description: Output of `vid2llm --version` or `pip show vid2llm`.
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: python
    attributes:
      label: Python version
      description: Output of `python --version`.
      placeholder: "3.12.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might help (logs, screenshots, related issues).
    validations:
      required: false